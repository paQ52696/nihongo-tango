# Supabase 免費專案一週沒有活動就會自動暫停（同步會失效，要到 Supabase 網站手動恢復）。
# 這裡每 3 天自動查詢一次資料庫，讓專案保持「有在使用」。
# 匿名身分沒有讀取權限（資料都受 RLS 保護），回應「permission denied」也代表查詢確實到了資料庫。
# 需要的 repository secrets：VITE_SUPABASE_URL、VITE_SUPABASE_ANON_KEY（和部署用的相同）
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 */3 * *' # 每 3 天，台灣時間 11:17
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # 貼上 secrets 時常多帶空白、換行；網址只留 https://xxxx.supabase.co（去掉 /rest/v1 之類的路徑）
          RAW=$(printf '%s' "$URL" | tr -d '[:space:]')
          URL=$(printf '%s' "$RAW" | sed -E 's#^(https?://[^/]+).*#\1#')
          if [ "$RAW" != "$URL" ] && [ "$RAW" != "$URL/" ]; then echo "::warning::VITE_SUPABASE_URL 後面多了路徑，已自動去掉（只需要 https://xxxx.supabase.co）"; fi
          KEY=$(printf '%s' "$KEY" | tr -d '[:space:]')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "沒有設定 VITE_SUPABASE_URL／VITE_SUPABASE_ANON_KEY，略過"; exit 0; fi
          echo "網址：$(printf '%s' "$URL" | sed -E 's#(https?://)[^.]{4}[^.]*#\1****#')"
          rm -f body.json
          code=$(curl -s --retry 3 --retry-all-errors --max-time 30 -o body.json -w '%{http_code}' \
            "$URL/rest/v1/decks?select=id&limit=1" -H "apikey: $KEY" || true)
          # 只印出錯誤代碼與訊息（不會含金鑰）
          echo "::notice::HTTP $code：$(head -c 300 body.json 2>/dev/null || true)"
          case "$code" in
            200) echo "Supabase 有回應" ;;
            401|403)
              if grep -q '42501' body.json; then echo "Supabase 有回應（資料庫回答「沒有權限」，代表查詢有到資料庫）"
              else echo "::error::Supabase 拒絕了金鑰：請確認 repo secrets 的 VITE_SUPABASE_ANON_KEY 和 .env 相同"; exit 1; fi ;;
            000) echo "::error::連不到 Supabase：請確認 VITE_SUPABASE_URL 是 https://xxxx.supabase.co"; exit 1 ;;
            5*|540) echo "::error::Supabase 沒有正常回應（專案可能已經暫停，請到 Supabase 網站按 Restore）"; exit 1 ;;
            *) echo "Supabase 有回應（HTTP $code）" ;;
          esac
